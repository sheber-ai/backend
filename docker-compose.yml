# Local dev infrastructure. Keycloak lives in ../keycloak-theme (make up).
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-sheber}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sheber}
      POSTGRES_DB: ${DB_NAME:-sheber}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
