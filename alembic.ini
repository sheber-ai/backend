[alembic]
script_location = %(here)s/alembic
# YYYYMMDDHHMMSS_<rev>_<slug>.py — миграции сортируются по времени создания
file_template = %%(year)d%%(month).2d%%(day).2d%%(hour).2d%%(minute).2d%%(second).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 60
prepend_sys_path = .
path_separator = os
timezone = UTC
# env.py выполняется и при `alembic revision` — там стоит запрет ручных миграций
revision_environment = true
# URL берётся из настроек приложения (settings/db_settings.py), здесь не задаётся
sqlalchemy.url =

[post_write_hooks]
# Сгенерированная миграция сразу приводится к стилю проекта
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
