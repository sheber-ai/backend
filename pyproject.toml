[project]
name = "sheber-backend"
version = "0.1.0"
description = "Sheber — платформа заказа мебели: клиенты, 3D-конструктор, подрядчики"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aioinject>=1.11.0",
    "alembic>=1.20.0",
    "fastapi>=0.142.4",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["alembic/versions", ".claude"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "ASYNC",         # async-ловушки
    "PT",            # pytest-стиль
    "T20",           # запрет print
    "RUF",
]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях — норма

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["common", "enums", "managers", "models", "rest_api", "schemas", "services", "settings"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/versions/", "^\\.venv/", "^\\.claude/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["db: тест требует запущенный PostgreSQL (make db-up)"]
