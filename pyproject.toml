[project]
name = "sheber-backend"
version = "0.1.0"
description = "Sheber API: custom furniture marketplace"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aioinject>=1.11.0",
    "alembic>=1.20.0",
    "fastapi>=0.142.4",
    "httpx>=0.28.1",
    "phonenumbers>=9.0.41",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["alembic/versions", ".claude"]

[tool.ruff.lint]
select = [
    "E", "W", "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "ASYNC",
    "PT",
    "T20",
    "RUF",
]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow Cyrillic in strings

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["common", "enums", "managers", "models", "rest_api", "schemas", "services", "settings"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/versions/", "^\\.venv/", "^\\.claude/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["db: requires running PostgreSQL (make db-up)"]
